name: Build Game and Watch Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Build Firmware inside Docker Container
      run: |
        docker run --rm -v ${{ github.workspace }}:/project -w /project/gandw_demo_single_screen espressif/idf:release-v6.0 /bin/bash -c ". /opt/esp/idf/export.sh && idf.py fullclean && idf.py build"

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: game_and_watch_firmware
        path: gandw_demo_single_screen/build/*.bin
